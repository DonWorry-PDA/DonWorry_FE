<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Wallet body -->
<rect x="12" y="38" width="76" height="46" rx="9" fill="#7AA0FF"/>
<!-- Wallet header band -->
<rect x="12" y="38" width="76" height="16" rx="9" fill="#5B8FFF"/>
<rect x="12" y="46" width="76" height="8" fill="#5B8FFF"/>
<!-- Section dividers -->
<line x1="41" y1="54" x2="41" y2="84" stroke="white" stroke-width="1.5" stroke-dasharray="3 2.5"/>
<line x1="62" y1="54" x2="62" y2="84" stroke="white" stroke-width="1.5" stroke-dasharray="3 2.5"/>
<!-- Left jar: travel (yellow coin) -->
<circle cx="26" cy="69" r="10" fill="#FCFF98" stroke="#D4AC0D" stroke-width="2"/>
<path d="M22 69 L26 64 L30 69" stroke="#9A7D0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="26" y1="64" x2="26" y2="74" stroke="#9A7D0A" stroke-width="2" stroke-linecap="round"/>
<!-- Middle jar: emergency (green coin) -->
<circle cx="51" cy="69" r="10" fill="#B4FFE0" stroke="#27AE60" stroke-width="2"/>
<rect x="47" y="65" width="8" height="8" rx="2" fill="#1E8449" opacity="0.7"/>
<!-- Right jar: housing (pink coin) -->
<circle cx="76" cy="69" r="10" fill="#FFD4E8" stroke="#E91E8C" stroke-width="2"/>
<path d="M72 71 L76 65 L80 71 L80 75 L72 75 Z" fill="#C2185B" opacity="0.7"/>
<!-- Decorative arc on top -->
<path d="M30 38 C30 28 70 28 70 38" stroke="#A8C4FF" stroke-width="3" stroke-linecap="round"/>
</svg>
